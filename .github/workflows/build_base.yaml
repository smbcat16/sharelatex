name: Docker sharelatex-base github CI

on:
  workflow_call:
    inputs:
      overleaf_ref:
        description: 'Tag hoặc commit SHA của overleaf/overleaf'
        required: false
        default: 'main'
        type: string
      scheme_full:
        description: 'Cài đầy đủ TeX Live (scheme-full)'
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      overleaf_ref:
        description: 'Tag hoặc commit SHA của overleaf/overleaf (mặc định: main)'
        required: false
        default: 'main'
        type: string
      scheme_full:
        description: 'Cài đầy đủ TeX Live (scheme-full)'
        required: false
        default: true
        type: boolean
      also_build_amd64:
        description: 'Build thêm kiến trúc AMD64 (tốn thời gian & ổ đĩa)'
        required: false
        default: false
        type: boolean

jobs:
  build-base:
    runs-on: self-hosted
    steps:
      - name: Cleanup build folder
        run: |
          rm -rf ./* ./.??* || true

      - name: Checkout Overleaf
        uses: actions/checkout@v4
        with:
          repository: overleaf/overleaf
          ref: ${{ inputs.overleaf_ref || 'main' }}
          path: ${{ github.workspace }}

      - name: Set up QEMU (chỉ chạy khi cần AMD64)
        if: ${{ inputs.also_build_amd64 == true }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Change scheme to scheme-full
        if: ${{ inputs.scheme_full == true }}
        working-directory: ${{ github.workspace }}
        run: sed -Ei 's/scheme-basic/scheme-full/' server-ce/Dockerfile-base

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ inputs.also_build_amd64 && 'linux/amd64,linux/arm64' || 'linux/arm64' }}
          context: ${{ github.workspace }}
          file: server-ce/Dockerfile-base
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sharelatex-base:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sharelatex-base:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/sharelatex-base:cache,mode=min

      - name: Cleanup Docker build cache
        if: always()
        run: docker builder prune -af
